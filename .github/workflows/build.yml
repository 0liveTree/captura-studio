name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: dtolnay/rust-toolchain@stable

      - name: FFmpeg (Gyan full, SVT-AV1)
        shell: pwsh
        run: |
          $dst = Join-Path $env:LOCALAPPDATA 'CapturaStudio\ffmpeg'
          New-Item -ItemType Directory -Force $dst | Out-Null
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z' -OutFile "$env:TEMP\ffmpeg-full.7z"
          7z x "$env:TEMP\ffmpeg-full.7z" "-o$env:TEMP\ffmpeg-full" -y | Out-Null
          $bin = Get-ChildItem "$env:TEMP\ffmpeg-full" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName $dst -Force

      - name: Engine
        working-directory: uvc03-rec
        run: |
          cargo build --release --bin captura-rec
          cargo test --release --lib

      - uses: microsoft/setup-msbuild@v2

      - name: App
        run: msbuild uwc03-winui\CapturaStudio.csproj /restore /p:Configuration=Release /p:Platform=x64 /p:NuGetAudit=false /v:m

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Setup
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer\build-installer.ps1

      - name: Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: captura-setup
          path: |
            installer/out/CapturaStudio-*-Setup.exe
            installer/out/latest.json

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/out/CapturaStudio-*-Setup.exe
            installer/out/latest.json
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
